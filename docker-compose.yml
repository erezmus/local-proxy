services:
  traefik:
    # Pinned by digest so a re-pushed tag can't change the image. Update the digest deliberately.
    image: traefik:v3.7@sha256:1336e85aaed293bd63d005086e0dd013b04078b26aaeb1c18b26a2f928af7e65
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Static config lives here rather than in a traefik.yml so ${PROXY_NETWORK} can be interpolated;
    # Traefik ignores flags and env vars when a config file is present.
    command:
      - --api.dashboard=true
      - --log.level=INFO
      - --accesslog=true
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --entrypoints.websecure.http.tls=true
      - --providers.docker.endpoint=unix:///var/run/docker.sock
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=${PROXY_NETWORK:-local-proxy}
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
    # Bound to loopback so the proxy and dashboard are not reachable from other machines on the network.
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./certs:/certs:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.dashboard.rule=Host(`traefik.test`)
      - traefik.http.routers.dashboard.service=api@internal

networks:
  proxy:
    name: ${PROXY_NETWORK:-local-proxy}
    external: true
